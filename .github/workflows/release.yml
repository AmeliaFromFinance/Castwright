name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Tag to release, like v0.2.0 (created if it doesn't exist)
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - name: Tag looks like a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_END'
            node scripts/changelog-section.mjs "$TAG"
            echo
            echo 'See the [guide](https://castwright.sinist3r.lol/guide/install/) for install steps.'
            echo 'CHANGELOG_END'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf libfuse2t64
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Signed update files need the private key. Without it the release still
      # builds, just without auto-update (no latest.json).
      - name: Update files
        id: updater
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            node scripts/enable-updater.mjs src-tauri/tauri.conf.json
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No auto-update::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so this build has no update files and no latest.json. Installed copies won't update themselves to it."
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASTWRIGHT_TWITCH_CLIENT_ID: ${{ vars.CASTWRIGHT_TWITCH_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Castwright ${{ env.TAG }}
          releaseBody: ${{ needs.check.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: ${{ steps.updater.outputs.on == 'true' }}
          updaterJsonPreferNsis: true
      - name: Keep the installers with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: castwright-${{ env.TAG }}-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Publishing makes every asset public, latest.json included. Marking it the
      # latest release is what makes releases/latest/download/latest.json point here.
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      - name: Check latest.json
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.json; then
            echo "::notice title=No auto-update::$TAG has no latest.json, so installed copies won't update themselves to it. Add the TAURI_SIGNING_PRIVATE_KEY secret for the next release."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node scripts/updater-check.mjs "$TAG" "$RUNNER_TEMP/latest.json"
