name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Tag to release, like v0.2.0 (created if it doesn't exist)
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - name: Tag looks like a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_END'
            node scripts/changelog-section.mjs "$TAG"
            echo
            echo 'See the [guide](https://castwright.sinist3r.lol/guide/install/) for install steps.'
            echo 'CHANGELOG_END'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf libfuse2t64
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASTWRIGHT_TWITCH_CLIENT_ID: ${{ vars.CASTWRIGHT_TWITCH_CLIENT_ID }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Castwright ${{ env.TAG }}
          releaseBody: ${{ needs.check.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Keep the installers with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: castwright-${{ env.TAG }}-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
